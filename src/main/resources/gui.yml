      action: upgrade_slot:1
      lore:
        - "<white> | <gray>Click with an upgrade item to add"
        - "<white> | <gray>new upgrades into Generator!"
    17:
      material: "LODESTONE"
      name: "<aqua>Upgrade your generator"
      action: upgrade
      lore:
        - "<white> | <yellow>Costs:"
        - "<white> | <gold>%cost%"
