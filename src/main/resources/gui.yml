        - "<white> | <gray>You can manage your generator from this menu!"
        - "<white> | <gray>grab your items, upgrade your generator and"
        - "<white> | <gray>take back it from the factory!!"
        - "<white>"
        - "<white> | <yellow>Does generators works while we are offline ?"
        - "<white> | <gray>Yes it does! but always make sure that the storage"
        - "<white> | <gray>is empty! So generator can generate items for you!"
    5:
      material: "GRAY_STAINED_GLASS_PANE"
      name: " "
